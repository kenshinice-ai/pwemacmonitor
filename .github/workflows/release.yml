name: Release

# Tag a version to publish it:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-14 ships Swift 5.10, whose compiler crashes on this source. Anything newer is fine.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swiftc --version

      # Signing and notarisation run only when the secrets exist, so forks and pull requests still
      # build. To enable: export the Developer ID Application certificate from Keychain Access as a
      # .p12, then
      #   gh secret set MACOS_CERTIFICATE < <(base64 -i cert.p12)
      #   gh secret set MACOS_CERTIFICATE_PASSWORD
      #   gh secret set NOTARY_APPLE_ID / NOTARY_TEAM_ID / NOTARY_PASSWORD   (app-specific password)
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f $RUNNER_TEMP/cert.p12

      - name: Store notarisation credentials
        if: env.NOTARY_APPLE_ID != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials pwe \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          echo "NOTARY_PROFILE=pwe" >> $GITHUB_ENV

      - name: Build and package
        run: ./build.sh --dmg

      - name: Verify the bundle
        run: |
          echo "--- signature ---"
          codesign -dv --verbose=2 "build/PWE MAC MONITOR.app" 2>&1 | grep -E "Authority|Signature|TeamIdentifier" || true
          APP="build/PWE MAC MONITOR.app"
          codesign --verify --deep --strict "$APP"
          test -f "$APP/Contents/Resources/Fonts/Inter.ttf"
          test -f "$APP/Contents/Resources/THIRD-PARTY-NOTICES.md"
          "$APP/Contents/MacOS/pwemon" --probe || echo "no Apple Silicon counters on this runner"

      - name: Checksums
        run: shasum -a 256 build/*.dmg | tee build/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PWE-MAC-MONITOR
          path: |
            build/*.dmg
            build/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Install

            1. Download the `.dmg` below and drag **PWE MAC MONITOR** to **Applications**.
            2. On first launch macOS will say it cannot check the app for malicious software —
               this build is ad-hoc signed, not notarised. Open **System Settings ▸ Privacy &
               Security**, scroll to **Security**, and click **Open Anyway**.

            Requires macOS 14 or later on an Apple Silicon Mac.
