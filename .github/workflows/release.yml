name: Release

# Tag a version to publish it:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14          # Apple Silicon runner — the app is arm64 only
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swiftc --version

      - name: Build and package
        run: ./build.sh --dmg

      - name: Verify the bundle
        run: |
          APP="build/PWE MAC MONITOR.app"
          codesign --verify --deep --strict "$APP"
          test -f "$APP/Contents/Resources/Fonts/Inter.ttf"
          test -f "$APP/Contents/Resources/THIRD-PARTY-NOTICES.md"
          "$APP/Contents/MacOS/pwemon" --probe || echo "no Apple Silicon counters on this runner"

      - name: Checksums
        run: shasum -a 256 build/*.dmg | tee build/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PWE-MAC-MONITOR
          path: |
            build/*.dmg
            build/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Install

            1. Download the `.dmg` below and drag **PWE MAC MONITOR** to **Applications**.
            2. On first launch macOS will say it cannot check the app for malicious software —
               this build is ad-hoc signed, not notarised. Open **System Settings ▸ Privacy &
               Security**, scroll to **Security**, and click **Open Anyway**.

            Requires macOS 14 or later on an Apple Silicon Mac.
