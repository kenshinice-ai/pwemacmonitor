name: Build

# Build verification only. Releases are cut locally with `Tools/release.sh <version>`,
# which signs with the Developer ID key in the login keychain and notarises with Apple.
# This workflow must never publish: it has no signing identity, so its output is ad-hoc
# signed, and a tag-triggered run once overwrote the notarised 1.0.1 DMG with an
# unsigned one.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only. A workflow that must never publish has no use for a token that can.
permissions:
  contents: read

jobs:
  build:
    # macos-14 ships Swift 5.10, whose compiler crashes on this source. Anything newer is fine.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swiftc --version

      # Signing and notarisation run only when the secrets exist, so forks and pull requests still
      # build. To enable: export the Developer ID Application certificate from Keychain Access as a
      # .p12, then
      #   gh secret set MACOS_CERTIFICATE < <(base64 -i cert.p12)
      #   gh secret set MACOS_CERTIFICATE_PASSWORD
      #   gh secret set NOTARY_APPLE_ID / NOTARY_TEAM_ID / NOTARY_PASSWORD   (app-specific password)
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f $RUNNER_TEMP/cert.p12

      - name: Store notarisation credentials
        if: env.NOTARY_APPLE_ID != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials pwe \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD"
          echo "NOTARY_PROFILE=pwe" >> $GITHUB_ENV

      - name: Build and package
        run: ./build.sh --dmg

      - name: Verify the bundle
        run: |
          # Whatever build.sh produced, not a name spelled here: this step looked for
          # "PWE MAC MONITOR.app" and a bundled Inter.ttf for a month after 1.3.0 dropped the
          # font and 1.4.0 renamed the bundle, and every run since was red for that alone.
          APP=$(find build -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          echo "--- signature ---"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|Signature|TeamIdentifier" || true
          codesign --verify --deep --strict "$APP"
          test -f "$APP/Contents/Resources/THIRD-PARTY-NOTICES.md"
          test -f "$APP/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          "$APP/Contents/MacOS/pwemon" --probe || echo "no Apple Silicon counters on this runner"
          # The thresholds are pure arithmetic and run anywhere; the port check needs the sensors.
          swiftc -O Sources/Core/*.swift Tools/thresholds/main.swift -o "$RUNNER_TEMP/thresholds"
          "$RUNNER_TEMP/thresholds" | tail -3

      - name: Checksums
        run: shasum -a 256 build/*.dmg | tee build/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PWE-MAC-MONITOR
          path: |
            build/*.dmg
            build/SHA256SUMS.txt
